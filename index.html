/*
  HRM Public Directory Stylesheet
  - CSS สำหรับหน้า public directory ของบุคลากรภายนอก
  - โทนทางการ/สถาบัน: กรมท่า (navy) + ทอง ตามอัตลักษณ์คณะ แต่ปรับให้โค้งมนขึ้น เงานุ่มขึ้น ลดความแข็งกระด้าง
  - คุม hero, toolbar, group tabs, department sub-tabs, person cards, profile detail และ responsive
*/

/* ฟอนต์ Noto Sans Thai ย้ายไปโหลดผ่าน <link> ใน index.html แทน @import เพื่อให้เบราว์เซอร์ดึงพร้อมกับ CSS/JS
   ได้เลยตั้งแต่ parse head แรก ไม่ต้องรอ public.css โหลดเสร็จก่อนถึงจะเห็น request ฟอนต์ */

:root{
  /* โทนหลักของสถาบัน */
  --navy:#0d2b4c;
  --navy2:#123a63;
  --navy-deep:#081a2e;
  --gold:#c19a34;
  --gold-deep:#8f6d15;
  --gold-soft:#f5edd6;

  --bg:#f5f6f9;
  --text:#232c38;
  --muted:#5f6875;
  --line:#e2e6ec;
  --line-strong:#cdd4dc;
  --white:#fff;
  --panel:#ffffff;
  --panel-alt:#f2f4f8;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;

  --shadow-sm:0 2px 8px rgba(13,43,76,.06);
  --shadow-md:0 8px 22px rgba(13,43,76,.09);
  --shadow-lg:0 18px 40px rgba(13,43,76,.14);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:'Noto Sans Thai',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

.hidden{display:none!important}

/* ---------- Hero ---------- */

/* พื้นกรมไล่สีให้มีมิติ แทนสีกรมเรียบล้วน */
.public-hero{
  position:sticky;
  top:0;
  z-index:40;
  color:white;
  overflow:hidden;
  background:linear-gradient(160deg,var(--navy2) 0%,var(--navy) 42%,var(--navy-deep) 100%);
}

/* เส้นคั่นสองชั้น: เส้นเหลืองทองทึบบาง ๆ ซ้อนบนเส้นทองไล่ระดับ ให้ดูมีมิติ */
.hero-shade{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:4px;
  background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent);
}

.hero-shade::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-2px;
  height:2px;
  background:linear-gradient(90deg,transparent,#f0c94d 18%,#f0c94d 82%,transparent);
}

.public-nav{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1180px;
  margin:0 auto;
  padding:9px 24px 5px;
}

/* ปุ่ม MIS ย้ายมาอยู่แถวเดียวกับ directory-head (พื้นหลังสว่าง) จึงใช้สไตล์เข้มแทนขาวโปร่งแบบตอนอยู่ใน header เข้ม */
.directory-head .public-nav-actions a{
  color:var(--navy);
  text-decoration:none;
  font-weight:700;
  font-size:12.5px;
  letter-spacing:.2px;
  padding:7px 14px;
  border:1px solid var(--line-strong);
  border-radius:999px;
  background:var(--white);
  transition:background .18s ease, border-color .18s ease, color .18s ease;
}

.directory-head .public-nav-actions a:hover{
  background:var(--panel-alt);
  border-color:var(--navy2);
  color:var(--navy2);
}

.public-nav-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  flex-wrap:wrap;
}

.nav-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:0;
  background:transparent;
  object-fit:contain;
  padding:0;
}

/* บล็อกข้อความ 2 บรรทัดข้างโลโก้: บรรทัดชิดกัน ไม่บังคับสูงเท่าโลโก้แล้ว */
.brand-text{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:1px;
}

.brand-text-th{
  color:white;
  font-weight:800;
  font-size:15px;
  line-height:1;
  letter-spacing:.2px;
  white-space:nowrap;
}

.brand-text-sub{
  color:#cdd8ea;
  font-weight:600;
  font-size:11px;
  line-height:1;
  letter-spacing:1.6px;
  white-space:nowrap;
}

.hero-content{
  position:relative;
  z-index:1;
  max-width:1180px;
  margin:0 auto;
  padding:4px 24px 12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-content p{
  margin:0 0 8px;
  color:var(--gold-soft);
  font-weight:700;
  font-size:13px;
  letter-spacing:.4px;
}

.hero-content h1{
  margin:0;
  max-width:720px;
  font-size:24px;
  font-weight:800;
  line-height:1.4;
  letter-spacing:.1px;
}

.hero-content span{
  display:block;
  max-width:640px;
  margin-top:10px;
  color:#e4ecf5;
  font-size:14px;
  line-height:1.65;
}

/* ---------- Layout ---------- */

.public-main{
  flex:1 0 auto;
  width:min(100%,1280px);
  max-width:1280px;
  margin:12px auto 48px;
  padding:0 24px;
  position:relative;
  z-index:2;
}
.academic-embed-main{
  margin-top:0;
  margin-bottom:24px;
}

.public-footer{
  flex:0 0 auto;
  margin:0 auto;
  padding:18px 24px 24px;
  width:100%;
  max-width:1180px;
  border-top:1px solid var(--line);
  color:var(--muted);
  text-align:center;
  font-size:12.5px;
  line-height:1.5;
}

/* ---------- Toolbar ---------- */

.directory-panel{
  display:block;
}

.directory-control{
  display:flex;
  flex-direction:column;
  gap:12px;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  box-shadow:none;
  margin-bottom:18px;
  padding:4px 0 16px;
}

.directory-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.directory-title{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}

.directory-head h2{
  margin:0;
  color:var(--navy);
  font-size:18px;
  font-weight:800;
  line-height:1.25;
}

.directory-head p{
  margin:0;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.45;
}

#resultSummary.is-busy{
  color:var(--navy);
  font-weight:700;
}

#resultSummary.is-busy::before{
  content:"";
  display:inline-block;
  width:13px;
  height:13px;
  margin-right:8px;
  border:2px solid rgba(13,43,76,.18);
  border-top-color:var(--gold);
  border-radius:50%;
  vertical-align:-2px;
  animation:publicSpin .75s linear infinite;
}

@keyframes publicSpin{
  to{transform:rotate(360deg)}
}

/* Overlay ฟรีซจอตอนกดเปิด/กลับหน้าโปรไฟล์ ให้เห็นชัดว่ากำลังโหลด */
.loading-overlay{
  position:fixed;
  inset:0;
  z-index:80;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(245,246,249,.85);
  backdrop-filter:blur(2px);
}

.loading-overlay-box{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 24px;
  border-radius:var(--radius-lg);
  background:var(--white);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  color:var(--navy);
  font-weight:700;
  font-size:15px;
}

.loading-spinner{
  width:20px;
  height:20px;
  flex:0 0 auto;
  border:3px solid rgba(13,43,76,.15);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:publicSpin .65s linear infinite;
}

.group-chooser{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  padding:5px;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
}

.group-choice{
  border:0;
  border-radius:var(--radius-md);
  padding:12px 12px;
  background:transparent;
  color:var(--muted);
  font:inherit;
  text-align:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  transition:background .18s ease, color .18s ease, box-shadow .18s ease;
}

.group-choice span{
  color:inherit;
  font-weight:700;
  font-size:14.5px;
  line-height:1.2;
}

.group-choice b{
  font-size:12px;
  font-weight:800;
  color:var(--navy);
  background:var(--panel-alt);
  border-radius:999px;
  padding:2px 8px;
  min-width:20px;
  line-height:1.55;
}

.group-choice:hover,
.group-choice:focus-visible{
  background:rgba(255,255,255,.7);
  color:var(--navy);
  outline:none;
}

.group-choice.active{
  background:var(--white);
  color:var(--navy);
  box-shadow:var(--shadow-sm);
  position:relative;
}

.group-choice.active::after{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  bottom:-6px;
  height:3px;
  border-radius:3px;
  background:var(--gold);
}

.group-choice.active b{
  background:var(--gold-soft);
  color:var(--gold-deep);
}

/* แท็บย่อยกลุ่มวิชา ใช้หน้าตาใกล้กับ group-chooser และแสดงเมื่อเลือกสายวิชาการ */
.department-tabs{
  display:grid;
  grid-template-columns:auto repeat(6,minmax(0,1fr));
  align-items:center;
  gap:6px;
  padding:5px;
  background:var(--panel-alt);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
}

.department-tabs-label{
  padding:0 10px;
  color:var(--navy);
  font-size:13px;
  font-weight:800;
  line-height:1.4;
  white-space:nowrap;
}

.department-tab{
  min-height:44px;
  border:0;
  border-radius:var(--radius-md);
  padding:9px 10px;
  background:transparent;
  color:var(--muted);
  font:inherit;
  font-size:12.5px;
  font-weight:700;
  line-height:1.35;
  cursor:pointer;
  text-align:center;
  position:relative;
  transition:background .18s ease, color .18s ease, box-shadow .18s ease;
}

.department-tab:hover,
.department-tab:focus-visible{
  background:rgba(255,255,255,.7);
  color:var(--navy);
  outline:none;
}

.department-tab.active{
  background:var(--white);
  color:var(--navy);
  box-shadow:var(--shadow-sm);
}

.department-tab.active::after{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  bottom:-6px;
  height:3px;
  border-radius:3px;
  background:var(--gold);
}

.public-filters{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

select,
input{
  width:100%;
  border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);
  padding:11px 14px;
  font:inherit;
  font-size:14.5px;
  background:var(--white);
  color:var(--text);
  outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}

select:focus,
input:focus{
  border-color:var(--navy2);
  box-shadow:0 0 0 3px rgba(18,58,99,.14);
}

input::placeholder{
  color:#8b93a0;
}

/* ---------- Cards ---------- */

/* ขนาดการ์ดในหน้ารวม (สายวิชาการ/สายสนับสนุน) เท่ากับแถวที่ 3 ของคณะผู้บริหาร (220–260px) แทนการยืดเต็ม 3 คอลัมน์ */
.profile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,260px));
  justify-content:center;
  gap:14px;
  min-width:0;
  transition:opacity .16s ease, filter .16s ease;
}

.profile-grid.is-updating{
  opacity:.55;
  filter:saturate(.85);
  pointer-events:none;
}

.group-heading{
  grid-column:1 / -1;
  margin:14px 0 2px;
  padding:8px 2px;
  border-radius:0;
  border-bottom:2px solid var(--line-strong);
  background:transparent;
  color:var(--navy);
  font-weight:800;
  font-size:16px;
  line-height:1.35;
}

.group-heading.executive-group{
  text-align:center;
  font-size:27px;
  margin:6px 0 22px;
  color:var(--gold-deep);
}

.group-heading.support-executive-group{
  text-align:center;
  border-bottom:0;
  border-top:1px solid var(--line);
  padding-top:18px;
  margin:20px auto 4px;
  width:min(620px,100%);
  font-size:27px;
  color:var(--gold-deep);
}

.group-heading.academic-group,
.group-heading.support-group{
  text-align:center;
  font-size:21px;
}

.executive-layout{
  grid-column:1 / -1;
  display:grid;
  gap:14px;
}

.executive-dean-row{
  display:flex;
  justify-content:center;
}

.executive-second-row{
  display:grid;
  grid-template-columns:repeat(3,minmax(220px,1fr));
  gap:14px;
  max-width:960px;
  width:100%;
  justify-self:center;
}

.executive-third-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(180px,1fr));
  gap:14px;
  max-width:1280px;
  width:100%;
  justify-self:center;
}

.executive-rest-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:14px;
  max-width:1280px;
  width:100%;
  justify-self:center;
}

.executive-rest-row .person-card{
  flex:1 1 220px;
  max-width:260px;
}

/* การ์ดหรูหรา: ไม่มีเส้นขอบรอบ ไม่ไล่สี มีเพียงเส้นทึบสีกรมด้านซ้ายด้านเดียว + เงาการ์ดปกติ (ไม่เรืองแสง) */
.person-card,
.loading-card{
  border:0;
  border-left:4px solid var(--navy);
  border-radius:var(--radius-lg);
  background:var(--panel);
  padding:16px;
  box-shadow:var(--shadow-sm);
}

.person-card{
  cursor:pointer;
  transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  display:flex;
  flex-direction:column;
  min-height:330px;
}

/* กรอบสีทอง/ไล่สีของผู้บริหารยังใช้ได้ทุกที่เพื่อบอกสถานะ แต่ขนาดรูป/การ์ดที่ใหญ่กว่าฐาน (เช่นของคณบดี)
   ต้อง "ใหญ่ขึ้น" เฉพาะตอนอยู่ในหน้าคณะผู้บริหารจริงๆ (executive-group / support-executive-group) เท่านั้น
   ถ้าคนคนเดียวกันไปโผล่ในหน้าสายวิชาการแบบรวม (academic-group) ต้องมีขนาดเท่าเพื่อนร่วมแถว */
/* การ์ดผู้บริหาร: พื้นขาวเหมือนการ์ดทั่วไป เส้นซ้ายเปลี่ยนเป็นทอง และเงาการ์ดปกติ ไม่เรืองแสง */
.person-card.is-executive{
  border-left-color:var(--gold);
  box-shadow:var(--shadow-sm);
}

.person-card.is-executive:hover{
  border-left-color:var(--gold);
  box-shadow:var(--shadow-md);
}

.person-card.is-dean{
  border-left-color:var(--gold);
  box-shadow:var(--shadow-md);
}

.person-card.executive-group.is-dean{
  max-width:600px;
  width:100%;
  padding:18px;
  min-height:390px;
}

.person-card.is-support-executive{
  grid-column:1 / -1;
  justify-self:center;
}

.person-card.support-executive-group.is-support-executive{
  max-width:600px;
  width:100%;
  padding:18px;
  min-height:390px;
}

.person-card:hover{
  transform:translateY(-2px);
  border-left-color:var(--navy2);
  box-shadow:var(--shadow-md);
}

.person-card.is-executive:hover,
.person-card.is-dean:hover{
  border-left-color:var(--gold);
}

.person-card:active{
  transform:translateY(0);
}

.group-choice:active{
  background:rgba(255,255,255,.85);
}

/* การ์ดบุคลากรทุกคนใช้ layout เดียวกัน: รูปอยู่กึ่งกลางด้านบน ข้อความ/แท็กอยู่ใต้ภาพ จัดกึ่งกลางทั้งหมด
   (เดิมแยกสไตล์เฉพาะผู้บริหาร แต่พอขึ้นพร้อมกันในกลุ่มเดียวกันแล้วดูไม่สมดุล เลยรวมเป็นแบบเดียว) */
.person-top{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:12px;
  min-width:0;
  flex:1;
}

.person-content{
  min-width:0;
  display:flex;
  flex:1;
  align-self:stretch;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.person-photo{
  width:128px;
  height:162px;
  border-radius:var(--radius-md);
  object-fit:cover;
  border:2px solid var(--white);
  background:var(--white);
  box-shadow:var(--shadow-sm);
  flex:0 0 auto;
}

.person-name{
  margin:0;
  color:var(--navy);
  font-size:16px;
  font-weight:700;
  line-height:1.35;
  max-width:100%;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:normal;
  text-wrap:balance;
}

.person-card.executive-group.is-dean .person-name,
.person-card.support-executive-group.is-support-executive .person-name{
  font-size:18px;
}

.person-card.executive-group.is-dean .person-photo,
.person-card.support-executive-group.is-support-executive .person-photo{
  width:168px;
  height:214px;
}

.person-role{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.is-loading-text{
  color:#9a7620!important;
  font-style:italic;
  font-weight:600;
}

.person-meta{
  margin-top:10px;
  display:grid;
  justify-items:center;
  gap:5px;
  color:#3a4250;
  font-size:12.5px;
  line-height:1.5;
}

.person-meta span{
  overflow-wrap:break-word;
}

.tag-row{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:auto;
  padding-top:12px;
}

.tag{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:4px 10px;
  background:var(--panel-alt);
  color:var(--navy);
  font-weight:700;
  font-size:11.5px;
  line-height:1.3;
}

.skeleton-card{
  min-height:150px;
  color:transparent;
  background:
    linear-gradient(90deg,rgba(238,241,245,.9),rgba(255,255,255,.96),rgba(238,241,245,.9));
  background-size:220% 100%;
  animation:publicSkeleton 1.1s ease-in-out infinite;
}

@keyframes publicSkeleton{
  0%{background-position:120% 0}
  100%{background-position:-120% 0}
}

/* ---------- Profile detail ---------- */

.profile-detail{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius-xl);
  padding:22px;
  box-shadow:var(--shadow-md);
}

.profile-page-head{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:18px;
}

.profile-page-head span{
  display:block;
  color:var(--muted);
  font-weight:700;
  font-size:12.5px;
  letter-spacing:.2px;
  margin-bottom:2px;
}

.profile-page-head h2{
  margin:0;
  color:var(--navy);
  font-size:26px;
  font-weight:800;
}

.back-button{
  border:0;
  border-radius:var(--radius-md);
  padding:12px 18px;
  background:var(--navy);
  color:white;
  font:inherit;
  font-weight:700;
  cursor:pointer;
  transition:background .18s ease;
}

.back-button:hover{
  background:var(--navy2);
}

.profile-modal{
  display:block;
}

.profile-content{
  min-width:0;
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  overflow:visible;
}

.profile-banner{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:26px;
  align-items:center;
  padding:28px;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 94% 12%,rgba(193,154,52,.14),transparent 30%),
    linear-gradient(135deg,var(--panel-alt),#ffffff);
}

.profile-banner img{
  width:180px;
  height:226px;
  object-fit:cover;
  border-radius:var(--radius-lg);
  border:5px solid white;
  background:white;
  box-shadow:var(--shadow-lg);
}

.profile-banner h2{
  margin:0 0 6px;
  color:var(--navy);
  font-size:26px;
  font-weight:800;
}

.profile-banner p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}

.profile-banner-info{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px 18px;
  margin:12px 0 14px;
}

.profile-banner-info .info-item{
  padding:0;
  border-bottom:0;
}

.profile-banner-info .info-label{
  color:var(--muted);
}

.profile-banner-info .info-value{
  color:var(--text);
  font-weight:700;
}

.profile-banner button{
  border:0;
  border-radius:var(--radius-md);
  padding:10px 16px;
  background:var(--navy);
  color:white;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

.profile-body{
  display:grid;
  grid-template-columns:210px minmax(0,1fr);
  gap:24px;
  align-items:stretch;
  padding:22px;
}

.profile-section-tabs{
  position:sticky;
  top:24px;
  align-self:start;
  height:max-content;
  max-height:none;
  overflow:visible;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  background:var(--panel-alt);
}

.profile-scroll{
  min-width:0;
  padding:0;
  max-height:none;
  overflow:visible;
  scroll-behavior:smooth;
  scroll-padding-top:12px;
}

.side-tab{
  width:100%;
  border:0;
  border-radius:var(--radius-md);
  padding:12px 14px;
  margin-bottom:0;
  background:transparent;
  color:var(--navy);
  font:inherit;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  text-align:left;
  transition:background .18s ease, color .18s ease;
}

.side-tab.active,
.side-tab:hover{
  background:var(--navy);
  color:white;
}

.profile-section{
  padding:18px 0;
  border-bottom:1px solid var(--line);
}

.profile-section:first-child{
  padding-top:0;
}

.profile-section:last-child{
  border-bottom:0;
}

.profile-section h3{
  margin:0 0 12px;
  color:var(--navy);
  font-size:19px;
  font-weight:800;
}

.profile-section-toggle{
  display:block;
}

.profile-section-toggle summary{
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px 16px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:linear-gradient(135deg,#fff,var(--panel-alt));
  color:var(--navy);
  font-size:17px;
  font-weight:800;
}

.profile-section-toggle summary::-webkit-details-marker{
  display:none;
}

.profile-section-toggle summary::after{
  content:"ยุบ";
  color:var(--muted);
  font-size:12.5px;
  font-weight:700;
}

.profile-section-toggle:not([open]) summary::after{
  content:"แสดง";
}

.profile-section-toggle summary b{
  color:var(--gold-deep);
  font-size:13px;
  margin-left:auto;
}

.profile-section-toggle[open] > :not(summary){
  margin-top:18px;
}

.section-kicker{
  margin:-4px 0 18px;
  color:var(--muted);
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px 28px;
}

.education-list,
.experience-list,
.research-list{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:18px;
  padding-left:34px;
}

.education-list::before,
.experience-list::before,
.research-list::before{
  content:"";
  position:absolute;
  left:14px;
  top:8px;
  bottom:8px;
  width:2px;
  background:var(--gold-soft);
}

.education-entry,
.experience-entry,
.research-entry{
  position:relative;
  display:grid;
  grid-template-columns:36px 1fr;
  gap:14px;
  margin-left:-34px;
}

.education-icon,
.experience-icon,
.research-icon{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--gold);
  color:#2a1e05;
  font-weight:800;
  font-size:14px;
  box-shadow:0 6px 16px rgba(193,154,52,.3);
  z-index:1;
}

.education-card,
.experience-card,
.research-card{
  padding:15px 16px;
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  background:white;
  box-shadow:var(--shadow-sm);
}

.degree-pill,
.experience-pill,
.research-pill{
  display:inline-flex;
  max-width:100%;
  padding:5px 11px;
  border-radius:8px;
  background:var(--gold-soft);
  color:var(--gold-deep);
  font-weight:700;
  font-size:13px;
  line-height:1.45;
}

.education-line{
  margin-top:9px;
  color:var(--text);
  line-height:1.65;
}

.education-year{
  margin-top:8px;
  color:#4a4360;
  font-weight:700;
  font-size:13.5px;
}

.experience-text{
  margin-top:9px;
  color:var(--text);
  line-height:1.75;
  white-space:pre-wrap;
}

.research-heading{
  display:block;
  margin-top:9px;
  color:var(--navy);
  font-weight:700;
  line-height:1.6;
}

.research-meta,
.research-fund{
  margin-top:5px;
  color:var(--muted);
  line-height:1.6;
  font-size:13.5px;
}

.research-link{
  display:inline-flex;
  margin-top:10px;
  color:var(--navy2);
  font-weight:700;
  text-decoration:none;
}

.research-link:hover{
  color:var(--gold-deep);
}

.info-item{
  padding:10px 0 12px;
  border-bottom:1px solid var(--line);
}

.info-label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
}

.info-value{
  line-height:1.65;
  white-space:pre-wrap;
}

/* ---------- Responsive ---------- */

@media (max-width:1200px){
  .profile-grid{
    grid-template-columns:repeat(auto-fill,minmax(220px,260px));
  }
}

@media (max-width:900px){
  .hero-content h1{font-size:20px}
  .public-main{
    max-width:1180px;
  }
  .directory-control{
    padding:4px 0 14px;
    margin-bottom:16px;
  }
  .group-chooser{grid-template-columns:repeat(3,minmax(0,1fr))}
  .group-choice{flex-direction:column;gap:4px;padding:10px 6px}
  .group-choice span{font-size:13.5px}
  .department-tabs{
    grid-template-columns:1fr;
  }
  .department-tabs-label{
    padding:6px 8px 2px;
    text-align:center;
  }
  .profile-grid{grid-template-columns:1fr}
  .executive-second-row{
    grid-template-columns:1fr;
  }
  .executive-rest-row .person-card{
    flex:1 1 100%;
    max-width:420px;
  }
  .group-heading.executive-group,
  .group-heading.support-executive-group{font-size:22px}
  .group-heading.academic-group,
  .group-heading.support-group{font-size:18px}
  .profile-detail{padding:14px}
  .profile-page-head{
    align-items:flex-start;
    flex-direction:column;
  }
  .profile-modal{
    display:block;
  }
  .profile-banner{
    grid-template-columns:110px 1fr;
    gap:16px;
    padding:18px;
  }
  .profile-banner img{
    width:110px;
    height:140px;

  <script>
/*
  HRM Public Directory Frontend
  - ใช้กับหน้า hosting/index.html ของชุด public directory แยก
  - ดึงข้อมูลบุคลากรจาก Apps Script action: publicList / publicProfile / publicResearch / publicFacultyPractice
  - หน้าแสดงผลแบ่ง 3 กลุ่มหลัก: คณะผู้บริหาร, สายวิชาการ, สายสนับสนุน
  - ฐานข้อมูลเก็บค่าตาม Supabase แต่หน้านี้แปลง/จัดกลุ่มเพื่อให้เหมาะกับการเผยแพร่ภายนอก
*/

// URL ของ Apps Script backend ที่หน้า public HRM เรียกใช้
// แหล่งข้อมูล: Worker ของ RUNS MIS (ช่องทางสาธารณะ publicList/publicProfile/publicResearch/publicFacultyPractice — ไม่ต้องล็อกอิน)
// ต้องเพิ่มโดเมนที่วางหน้านี้ใน ALLOWED_ORIGINS ของ Worker
const API_URL = (window.HR_DIRECTORY_API || 'https://runsmis.nurse-lab.workers.dev/api/legacy/hrm');

// State หลักของหน้า: รายชื่อทั้งหมด, รายชื่อที่กำลังแสดง, งานวิจัย, timer สำหรับ debounce render
let publicPeople = [];
let visiblePublicPeople = [];
let publicResearch = [];
let publicFacultyPractice = [];
let publicRenderTimer = 0;
let activePublicDepartment = '';
let publicDepartmentMap = new Map();
let publicRenderToken = 0;
const publicProfileCache = new Map();
const pendingPublicProfileLoads = new Set();
// กันไม่ให้ hydrate คนเดิมซ้ำทุกครั้งที่ render (เช่น พิมพ์ค้นหา/สลับแท็บ) ลองแค่ครั้งเดียวต่อคนต่อการโหลดหน้า
const attemptedHydrationIds = new Set();

// Cache ฝั่ง browser ช่วยให้เปิดหน้าซ้ำเร็วขึ้น และยังแสดงข้อมูลล่าสุดได้ถ้า backend ล่มชั่วคราว
const PUBLIC_CACHE_KEY = 'hrm_public_people_v13_doctoral_prefix';
const PUBLIC_PROFILE_CACHE_PREFIX = 'hrm_public_profile_person_v2_doctoral_';
const PUBLIC_RESEARCH_CACHE_PREFIX = 'hrm_public_research_person_v2_';
const PUBLIC_CACHE_MAX_AGE = 1000 * 60 * 60;
const PUBLIC_LOADING_TEXT = 'กำลังโหลด';
const PUBLIC_API_TIMEOUT_MS = 45000;

document.addEventListener('DOMContentLoaded', () => {
  applyPublicAccessControls();
  populatePublicDepartmentOptions([]);
  loadPublicPeople();
});

function getMisUser() {
  try {
    return JSON.parse(localStorage.getItem('mis_user') || 'null');
  } catch (err) {
    return null;
  }
}

function isHrmAdminUser(user) {
  return String(user && (user.hrRole || user.HR_ROLE) || '').trim().toUpperCase() === 'ADMIN';
}

function applyPublicAccessControls() {
  const user = getMisUser();
  const canOpenHrmAdmin = Boolean(user && isHrmAdminUser(user));

  document.querySelectorAll('[data-hr-admin-only]').forEach(el => {
    if (!canOpenHrmAdmin) el.remove();
  });
}

// Wrapper เรียก Apps Script แบบ GET พร้อม action/system ที่ backend ใช้แยกงาน
async function apiGet(action, params = {}) {
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('system', 'HRM');
  url.searchParams.set('_ts', String(Date.now()));

  Object.keys(params).forEach(key => {
    url.searchParams.set(key, params[key]);
  });

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), PUBLIC_API_TIMEOUT_MS);

  try {
    const res = await fetch(url.toString(), {
      signal: controller.signal,
      cache: 'no-store'
    });
    if (!res.ok) throw new Error(`API ตอบกลับ HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    if (err && err.name === 'AbortError') {
      throw new Error('API ใช้เวลาตอบกลับนานเกินไป กรุณาลองโหลดหน้าใหม่อีกครั้ง');
    }
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

// โหลดรายชื่อบุคลากรสำหรับหน้า directory: แสดง cache ก่อน แล้วค่อย refresh จาก backend
async function loadPublicPeople() {
  const hasCachedRows = renderCachedPublicPeople();
  if (!hasCachedRows) {
    document.getElementById('resultSummary').textContent = 'กำลังโหลดข้อมูล...';
    document.getElementById('publicCards').innerHTML = renderPublicSkeletonCards(3);
  }

  try {
    const res = await apiGet('publicList', { view: 'directory' });
    if (!res.success) throw new Error(res.message || 'โหลดข้อมูลไม่สำเร็จ');

    setPublicPeople(res.data || []);
    cachePublicPeople(publicPeople);

    renderPublicDirectory();
  } catch (err) {
    if (publicPeople.length) {
      document.getElementById('resultSummary').textContent =
        `แสดงข้อมูลล่าสุดที่บันทึกไว้ ${publicPeople.length} คน`;
      return;
    }

    document.getElementById('publicCards').innerHTML =
      `<div class="loading-card">ไม่สามารถโหลดข้อมูลได้: ${escapeHtml(err.message)}</div>`;
    document.getElementById('resultSummary').textContent = 'โหลดข้อมูลไม่สำเร็จ';
  }
}

function setPublicResearch(rows) {
  publicResearch = (rows || []).filter(item => item.PERSON_ID);
}

function setPublicFacultyPractice(rows) {
  publicFacultyPractice = (rows || []).filter(item => item.PERSON_ID);
}

function setPublicPeople(rows) {
  publicPeople = rows
    .map(person => Object.assign({}, person, publicProfileCache.get(String(person.PERSON_ID || '').trim()) || {}))
    .filter(isPublicPerson)
    .sort(comparePublicPeople);
  populatePublicDepartmentOptions(publicPeople);
  if (!getActivePublicGroup()) updateGroupChooser('EXECUTIVE');
  renderPublicGroupCounts();
}

const PERMANENT_PUBLIC_DEPARTMENTS = [
  ['DEP001', 'กลุ่มวิชาการพยาบาลมารดาทารกและการผดุงครรภ์'],
  ['DEP002', 'กลุ่มวิชาการพยาบาลผู้ใหญ่และผู้สูงอายุ'],
  ['DEP003', 'กลุ่มวิชาการพยาบาลสุขภาพจิตและจิตเวช'],
  ['DEP004', 'กลุ่มวิชาการพยาบาลเด็กและวัยรุ่น'],
  ['DEP005', 'กลุ่มวิชาการพยาบาลอนามัยชุมชน']
];

// สร้างแท็บย่อยกลุ่มวิชาจากรายการถาวร แล้วเติมกลุ่มวิชาที่เจอจากข้อมูลจริงเพิ่มภายหลัง
function populatePublicDepartmentOptions(rows = []) {
  const container = document.getElementById('departmentTabs');
  if (!container) return;

  const map = new Map();
  PERMANENT_PUBLIC_DEPARTMENTS.forEach(([, name]) => {
    map.set(name, name);
  });

  rows.forEach(row => {
    const value = normalizeText(getPersonDepartmentText(row));
    if (!value) return;
    if (normalizeDepartment(value) === normalizeDepartment('สำนักงานเลขานุการคณะฯ')) return;
    if (!Array.from(map.values()).some(name => normalizeDepartment(name) === normalizeDepartment(value))) {
      map.set(value, value);
    }
  });

  const options = Array.from(map.entries())
    .sort((a, b) => toDepartmentFilterLabel(a[1]).localeCompare(toDepartmentFilterLabel(b[1]), 'th'));

  publicDepartmentMap = map;

  const currentKey = normalizeDepartment(activePublicDepartment);
  const stillValid = options.some(([id, name]) =>
    normalizeDepartment(id) === currentKey || normalizeDepartment(name) === currentKey
  );
  if (!stillValid) activePublicDepartment = '';

  container.innerHTML = [
    '<span class="department-tabs-label">กลุ่มวิชา</span>',
    `<button type="button" class="department-tab${!activePublicDepartment ? ' active' : ''}" data-dept="" onclick="setPublicDepartment('')">ทุกกลุ่มวิชา</button>`,
    ...options.map(([id, name]) => {
      const isActive = normalizeDepartment(id) === currentKey;
      return `<button type="button" class="department-tab${isActive ? ' active' : ''}" data-dept="${escapeAttr(id)}" onclick="setPublicDepartment('${escapeAttr(id)}')">${escapeHtml(toDepartmentFilterLabel(name))}</button>`;
    })
  ].join('');

  updateDepartmentTabsVisibility(getActivePublicGroup());
}

// สลับกลุ่มวิชาที่เลือก (แท็บย่อยของสายวิชาการ)
function setPublicDepartment(id) {
  activePublicDepartment = id || '';
  document.querySelectorAll('.department-tab').forEach(btn => {
    btn.classList.toggle('active', (btn.dataset.dept || '') === activePublicDepartment);
  });
  renderPublicDirectory();
}

// แท็บกลุ่มวิชาแสดงเฉพาะเมื่อเลือกกลุ่มหลัก "สายวิชาการ"
function updateDepartmentTabsVisibility(group) {
  const container = document.getElementById('departmentTabs');
  if (!container) return;
  container.classList.toggle('hidden', group !== 'LECTURER');
}

function renderCachedPublicPeople() {
  try {
    const cached = JSON.parse(localStorage.getItem(PUBLIC_CACHE_KEY) || 'null');
    if (!cached || Date.now() - cached.savedAt > PUBLIC_CACHE_MAX_AGE) return;
    if (!Array.isArray(cached.rows) || !cached.rows.length) {
      localStorage.removeItem(PUBLIC_CACHE_KEY);
      return false;
    }

    setPublicPeople(cached.rows || []);
    renderPublicDirectory();
    document.getElementById('resultSummary').textContent =
      `แสดงข้อมูลล่าสุด ${publicPeople.length} คน`;
    return true;
  } catch (err) {
    localStorage.removeItem(PUBLIC_CACHE_KEY);
  }
  return false;
}

function cachePublicPeople(rows) {
  if (!Array.isArray(rows) || !rows.length) {
    localStorage.removeItem(PUBLIC_CACHE_KEY);
    return;
  }
  try {
    localStorage.setItem(PUBLIC_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      rows
    }));
  } catch (err) {
    localStorage.removeItem(PUBLIC_CACHE_KEY);
  }
}

function getPublicProfileCacheKey(personId) {
  return `${PUBLIC_PROFILE_CACHE_PREFIX}${String(personId || '').trim()}`;
}

function getCachedPublicProfile(personId) {
  const cacheKey = String(personId || '').trim();
  if (!cacheKey) return null;
  if (publicProfileCache.has(cacheKey)) {
    const person = publicProfileCache.get(cacheKey);
    mergePublicPerson(person);
    return person;
  }

  try {
    const cached = JSON.parse(localStorage.getItem(getPublicProfileCacheKey(cacheKey)) || 'null');
    if (!cached || Date.now() - cached.savedAt > PUBLIC_CACHE_MAX_AGE) return null;
    if (cached.person) {
      publicProfileCache.set(cacheKey, cached.person);
      mergePublicPerson(cached.person);
      return cached.person;
    }
  } catch (err) {
    localStorage.removeItem(getPublicProfileCacheKey(cacheKey));
  }

  return null;
}

function cachePublicProfile(personId, person) {
  const cacheKey = String(personId || '').trim();
  if (!cacheKey || !person) return;

  publicProfileCache.set(cacheKey, person);
  try {
    localStorage.setItem(getPublicProfileCacheKey(cacheKey), JSON.stringify({
      savedAt: Date.now(),
      person
    }));
  } catch (err) {
    localStorage.removeItem(getPublicProfileCacheKey(cacheKey));
  }
}

function getPublicResearchCacheKey(personId) {
  return `${PUBLIC_RESEARCH_CACHE_PREFIX}${String(personId || '').trim()}`;
}

function renderCachedPublicResearch(personId) {
  try {
    const cached = JSON.parse(localStorage.getItem(getPublicResearchCacheKey(personId)) || 'null');
    if (!cached || Date.now() - cached.savedAt > PUBLIC_CACHE_MAX_AGE) return false;
    setPublicResearch(cached.rows || []);
    return true;
  } catch (err) {
    localStorage.removeItem(getPublicResearchCacheKey(personId));
    return false;
  }
}

function cachePublicResearch(personId, rows) {
  try {
    localStorage.setItem(getPublicResearchCacheKey(personId), JSON.stringify({
      savedAt: Date.now(),
      rows
    }));
  } catch (err) {
    localStorage.removeItem(getPublicResearchCacheKey(personId));
  }
}

// โหลดข้อมูล profile รายคนและงานวิจัยรายคน เพื่อไม่โหลดทุกอย่างตั้งแต่เปิดหน้า
async function loadPublicResearchForPerson(personId) {
  if (!personId) return [];
  if (renderCachedPublicResearch(personId)) return getResearchByPerson(personId);

  const result = await apiGet('publicResearch', { personId });
  if (!result.success) throw new Error(result.message || 'โหลดข้อมูลงานวิจัยไม่สำเร็จ');

  setPublicResearch(result.data || []);
  cachePublicResearch(personId, result.data || []);
  return getResearchByPerson(personId);
}

async function loadPublicFacultyPracticeForPerson(personId) {
  if (!personId) return [];
  const result = await apiGet('publicFacultyPractice', { personId });
  if (!result.success) throw new Error(result.message || 'โหลดข้อมูลความเชี่ยวชาญไม่สำเร็จ');

  setPublicFacultyPractice(result.data || []);
  return getFacultyPracticeByPerson(personId);
}

async function loadPublicProfile(personId) {
  const fallback = publicPeople.find(item => String(item.PERSON_ID) === String(personId));
  const cacheKey = String(personId || '').trim();
  const cached = getCachedPublicProfile(cacheKey);
  if (cached) return cached;

  try {
    const result = await apiGet('publicProfile', { personId });
    if (result.success && result.data) {
      mergePublicPerson(result.data);
      cachePublicProfile(cacheKey, result.data);
      return result.data;
    }
  } catch (err) {
    return fallback;
  }
  return fallback;
}

function mergePublicPerson(person) {
  const id = String(person && person.PERSON_ID || '').trim();
  if (!id) return;
  publicPeople = publicPeople.map(item =>
    String(item.PERSON_ID || '').trim() === id ? Object.assign({}, item, person) : item
  );
  visiblePublicPeople = visiblePublicPeople.map(item =>
    String(item.PERSON_ID || '').trim() === id ? Object.assign({}, item, person) : item
  );
  updatePublicCardFromPerson(publicPeople.find(item => String(item.PERSON_ID || '').trim() === id) || person);
  // หมายเหตุ: เดิม merge ทีไรจะ rebuild แท็บกลุ่มวิชาทั้งชุดทันที (populatePublicDepartmentOptions)
  // แต่ hydrate ทำงานแบบ stagger หลายคนต่อครั้ง ทำให้ innerHTML ของแท็บถูกสร้างใหม่รัว ๆ
  // จนแท็บกะพริบ/หาย + หน้าอืด จึงตัดออก แท็บกลุ่มวิชาถูกสร้างครบแล้วตอนโหลดลิสต์ (setPublicPeople)
}

function setPublicDirectoryBusy(message) {
  const summary = document.getElementById('resultSummary');
  const cards = document.getElementById('publicCards');
  if (summary) {
    summary.textContent = message || 'กำลังดำเนินการ...';
    summary.classList.add('is-busy');
  }
  if (cards) cards.classList.add('is-updating');
}

function clearPublicDirectoryBusy() {
  document.getElementById('resultSummary')?.classList.remove('is-busy');
  document.getElementById('publicCards')?.classList.remove('is-updating');
}

function renderPublicDirectory() {
  setPublicDirectoryBusy('กำลังกรองข้อมูล...');
  clearTimeout(publicRenderTimer);
  publicRenderTimer = setTimeout(renderPublicDirectoryNow, 90);
}

// Render รายชื่อหลังกรอง: ปุ่มกลุ่มหลักควบคุม group, dropdown กลุ่มวิชาไม่กระทบคณะผู้บริหาร
// แสดงการ์ดทันทีจากข้อมูลที่มีอยู่แล้ว (list endpoint คำนวณกลุ่มวิชา/ตำแหน่งให้ครบอยู่แล้วปกติ)
// ถ้ามีบางคนที่ข้อมูลยังไม่ครบค่อยดึงเพิ่มเป็นพื้นหลังทีหลัง ไม่บล็อกให้รอทั้งกลุ่มเหมือนเดิม
function renderPublicDirectoryNow() {
  const group = getActivePublicGroup() || 'EXECUTIVE';
  const department = group === 'LECTURER' ? activePublicDepartment : '';
  const q = normalizeText(document.getElementById('publicSearch').value).toLowerCase();

  updateDepartmentTabsVisibility(group);

  const rows = publicPeople.filter(person => {
    const haystack = [
      getPersonDisplayName(person),
      person.FULL_NAME,
      person.FIRST_NAME,
      person.LAST_NAME,
      person.POSITION,
      person.DEPARTMENT,
      person.DEPARTMENT_NAME,
      person.DEPARTMENT_ID,
      person.PERSON_STATUS_SYS,
      person.WORK_GROUP,
      person.EMAIL
    ].map(normalizeText).join(' ').toLowerCase();

    return (!group || (group === 'EXECUTIVE' ? isAcademicExecutivePerson(person) : isPersonInPublicGroup(person, group)))
      // ผู้บริหารสายวิชาการยังต้องแสดงในกลุ่มวิชาของตัวเองตามปกติ (ไม่ตัดออกจากกลุ่มวิชาที่เลือก)
      && (!department || normalizeDepartment(getPersonDepartmentText(person)) === normalizeDepartment(department))
      && (!q || haystack.includes(q));
  }).sort((a, b) => group === 'EXECUTIVE' ? compareExecutivePeople(a, b) : comparePublicPeople(a, b));

  visiblePublicPeople = rows;

  document.getElementById('resultSummary').textContent =
    `แสดง ${rows.length} คน จาก ${publicPeople.length} คน`;

  const cardHtml = renderGroupedPublicCards(visiblePublicPeople, group, department);
  document.getElementById('publicCards').innerHTML =
    cardHtml || '<div class="loading-card">ไม่พบข้อมูลตามเงื่อนไข</div>';

  updateGroupChooser(group);
  clearPublicDirectoryBusy();

  // เอา hydrateVisiblePublicCards กลับมาใช้: list endpoint ไม่ได้ resolve ตำแหน่ง/กลุ่มวิชาครบทุกคนจริง ๆ
  // (คนที่ตัด flow นี้ออกไปตำแหน่ง/กลุ่มวิชาหายเป็น "-" ทั้งที่หน้าโปรไฟล์ยังมีข้อมูลถูกต้อง) จึงต้องดึงเพิ่มเป็นพื้นหลัง
  hydrateVisiblePublicCards();
}

function renderPublicSkeletonCards(count) {
  const skeletonCount = Math.max(1, Math.min(Number(count) || 1, 8));
  return Array.from({ length: skeletonCount })
    .map(() => '<div class="loading-card skeleton-card" aria-hidden="true"></div>')
    .join('');
}

async function hydrateRowsBeforeRender(rows) {
  const ids = (rows || [])
    .filter(needsPublicProfileHydration)
    .map(person => String(person.PERSON_ID || '').trim())
    .filter(Boolean);
  if (!ids.length) return;

  await Promise.all(ids.map(id =>
    loadPublicProfile(id).catch(() => null)
  ));
  visiblePublicPeople = rows.map(person => {
    const id = String(person.PERSON_ID || '').trim();
    return publicPeople.find(item => String(item.PERSON_ID || '').trim() === id) || person;
  });
}

function setPublicGroup(group) {
  updateGroupChooser(group);
  renderPublicDirectory();
}

function getActivePublicGroup() {
  return document.querySelector('.group-choice.active')?.dataset.group || '';
}

function renderPublicGroupCounts() {
  const executive = publicPeople.filter(isAcademicExecutivePerson).length;
  const academic = publicPeople.filter(person => isPersonInPublicGroup(person, 'LECTURER')).length;
  const support = publicPeople.filter(person => !isExecutivePerson(person) && getPersonnelGroup(person) === 'STAFF').length;

  setText('executiveGroupCount', executive);
  setText('academicGroupCount', academic);
  setText('supportGroupCount', support);
}

function updateGroupChooser(group) {
  document.querySelectorAll('.group-choice').forEach(button => {
    button.classList.toggle('active', button.dataset.group === group);
  });
}

function setText(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}

// แบ่งหัวข้อและ layout ของ card แต่ละกลุ่ม
// คณะผู้บริหารมี layout พิเศษ: คณบดีอยู่กลาง, แถวถัดไป 3 คน, ที่เหลือไหลตาม grid
function renderGroupedPublicCards(rows, group, department) {
  const academicTitle = group === 'LECTURER' && department
    ? getSelectedDepartmentLabel()
    : 'บุคลากรสายวิชาการ';
  const groups = group === 'EXECUTIVE'
    ? [['คณะผู้บริหาร', rows, 'executive-group']]
    : group === 'LECTURER'
    ? [[academicTitle, rows, 'academic-group']]
    : group === 'STAFF'
    ? [
        ['ผู้บริหารสายสนับสนุน', rows.filter(isSupportExecutivePerson), 'support-executive-group'],
        ['บุคลากรสายสนับสนุน', rows.filter(person => !isSupportExecutivePerson(person)), 'support-group']
      ]
    : [
        ['คณะผู้บริหาร', rows.filter(isAcademicExecutivePerson), 'executive-group'],
        ['บุคลากรสายวิชาการ', rows.filter(person => !isAcademicExecutivePerson(person) && getPersonnelGroup(person) === 'LECTURER'), 'academic-group'],
        ['บุคลากรสายสนับสนุน', rows.filter(person => !isExecutivePerson(person) && getPersonnelGroup(person) === 'STAFF'), 'support-group']
      ];

  return groups
    .filter(item => item[1].length)
    .map(item => `
      <div class="group-heading ${escapeAttr(item[2] || '')}">${escapeHtml(item[0])}</div>
      ${item[2] === 'executive-group' ? renderExecutiveCards(item[1]) : item[1].map(person => renderPersonCard(person, item[2])).join('')}
    `)
    .join('');
}

// Layout เฉพาะกลุ่มคณะผู้บริหาร
function renderExecutiveCards(rows) {
  const dean = rows.find(isDeanPerson);
  const others = rows.filter(person => !isDeanPerson(person));
  const secondRow = others.slice(0, 3);
  const thirdRow = others.slice(3, 8);
  const rest = others.slice(8);

  return `
    <div class="executive-layout">
      ${dean ? `<div class="executive-dean-row">${renderPersonCard(dean, 'executive-group')}</div>` : ''}
      ${secondRow.length ? `<div class="executive-second-row">${secondRow.map(person => renderPersonCard(person, 'executive-group')).join('')}</div>` : ''}
      ${thirdRow.length ? `<div class="executive-third-row">${thirdRow.map(person => renderPersonCard(person, 'executive-group')).join('')}</div>` : ''}
      ${rest.length ? `<div class="executive-rest-row">${rest.map(person => renderPersonCard(person, 'executive-group')).join('')}</div>` : ''}
    </div>
  `;
}

// สร้าง HTML ของ card บุคลากร 1 คน
function renderPersonCard(person, groupClass) {
  const id = escapeAttr(person.PERSON_ID);
  const photo = person.PIC || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
  const workGroup = isPersonInPublicAcademicGroup(person) ? 'สายวิชาการ' : 'สายสนับสนุน';
  const executiveLabel = getExecutiveLabel(person);
  const executiveTag = executiveLabel ? `<span class="tag">${escapeHtml(executiveLabel)}</span>` : '';
  const departmentText = getPersonDepartmentText(person);
  const positionText = getPublicPositionText(person);
  const cardClass = [
    'person-card',
    groupClass || '',
    isDeanPerson(person) ? 'is-dean' : '',
    isSupportExecutivePerson(person) ? 'is-support-executive' : '',
    isExecutivePerson(person) ? 'is-executive' : ''
  ].filter(Boolean).join(' ');

  return `
    <article class="${cardClass}" data-person-id="${id}" onclick="showPublicProfile('${id}')">
      <div class="person-top">
        <img class="person-photo" src="${escapeAttr(photo)}" alt="" loading="lazy" decoding="async">
        <div class="person-content">
          <h3 class="person-name">${escapeHtml(getPersonDisplayName(person))}</h3>
          <p class="person-role${positionText ? '' : ' is-loading-text'}">${escapeHtml(positionText || PUBLIC_LOADING_TEXT)}</p>
          <div class="person-meta">
            <span class="person-department${departmentText ? '' : ' is-loading-text'}">${escapeHtml(departmentText || PUBLIC_LOADING_TEXT)}</span>
            <span class="person-email">${escapeHtml(person.EMAIL || '')}</span>
          </div>
          <div class="tag-row">
            <span class="tag">${escapeHtml(workGroup)}</span>
            ${executiveTag}
          </div>
        </div>
      </div>
    </article>
  `;
}

// เปิดหน้ารายละเอียดบุคลากร: แสดงข้อมูลหลักทันทีที่พร้อม ไม่ต้องรอ research/faculty-practice
// (เดิมรอครบทั้ง 3 endpoint พร้อมกันก่อนค่อยขึ้นหน้าจอ ถ้า endpoint ใดช้าจะดึงเวลารวมช้าไปด้วย)
async function showPublicProfile(personId) {
  // แสดง overlay ฟรีซจอทันทีตั้งแต่กด ไม่ต้องรอ network ก่อน ให้รู้สึกตอบสนองเร็ว
  showPublicLoadingOverlay('กำลังโหลด...');
  setPublicDirectoryBusy('กำลังเปิดรายละเอียด...');

  let person;
  try {
    person = await loadPublicProfile(personId);
  } catch (err) {
    person = null;
  }

  if (!person) {
    clearPublicDirectoryBusy();
    hidePublicLoadingOverlay();
    return;
  }

  renderPublicProfileShell(person);

  document.getElementById('directoryPanel').classList.add('hidden');
  document.getElementById('publicProfile').classList.remove('hidden');
  clearPublicDirectoryBusy();
  hidePublicLoadingOverlay();
  document.getElementById('publicProfile').scrollIntoView({ behavior: 'smooth', block: 'start' });

  // งานวิจัย/ความเชี่ยวชาญเป็นคนละ endpoint แยกต่างหาก โหลดแบบไม่บล็อกหน้าโปรไฟล์หลัก
  // แล้วค่อยเติมเข้า DOM ทีหลัง (เฉพาะกรณีที่ยังเปิดดูคนเดิมอยู่ ไม่ใช่สลับไปคนอื่นแล้ว)
  Promise.all([
    loadPublicResearchForPerson(personId).catch(() => []),
    loadPublicFacultyPracticeForPerson(personId).catch(() => [])
  ]).then(([researchRows, practiceRows]) => {
    if (document.querySelector(`#publicProfile [data-profile-person="${cssEscapeValue(personId)}"]`)) {
      fillPublicProfileExtras(researchRows, practiceRows);
    }
  });
}

// สร้างโครงหน้าโปรไฟล์จากข้อมูลหลักที่มีอยู่แล้วใน person (ไม่ต้องรอ research/faculty-practice)
function renderPublicProfileShell(person) {
  const isTeacher = isPersonInPublicAcademicGroup(person);
  const photo = person.PIC || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
  const profile = document.getElementById('publicProfile');

  const educationBlocks = [
    renderEducation('ปริญญาตรี', person.BACHELOR_DEGREE, person.BACHELOR_MAJOR, person.BACHELOR_DEGREES_INST_ID, person.BACHELOR_DEGREES_YEAR),
    renderEducation('ปริญญาโท', person.MASTER_DEGREE, person.MASTER_MAJOR, person.MASTER_DEGREES_INST_ID, person.MASTER_DEGREES_YEAR),
    renderEducation('ปริญญาเอก', person.DOCTORAL_DEGREE, person.DOCTORAL_MAJOR, person.DOCTORAL_DEGREES_OTHER_ID, person.DOCTORAL_DEGREES_YEAR)
  ].filter(Boolean).join('');

  profile.innerHTML = `
    <div class="profile-page-head" data-profile-person="${escapeAttr(person.PERSON_ID)}">
      <button type="button" class="back-button" onclick="closePublicProfile()">กลับไปรายชื่อ</button>
      <div>
        <span>รายละเอียดบุคลากร</span>
        <h2>${escapeHtml(getPersonDisplayName(person))}</h2>
      </div>
    </div>

    <div class="profile-modal">
      <div class="profile-content">
        <div class="profile-banner">
          <img src="${escapeAttr(photo)}" alt="" loading="eager" decoding="async">
          <div>
            <h2>${escapeHtml(getPersonDisplayName(person))}</h2>
            ${renderLoadingAwareParagraph(getPublicPositionText(person))}
            ${renderLoadingAwareParagraph(getPersonDepartmentText(person))}
            <div class="tag-row">
              <span class="tag">${escapeHtml(isPersonInPublicAcademicGroup(person) ? 'สายวิชาการ' : 'สายสนับสนุน')}</span>
              ${getExecutiveLabel(person) ? `<span class="tag">${escapeHtml(getExecutiveLabel(person))}</span>` : ''}
            </div>
          </div>
        </div>

        <div class="profile-body">
          <aside class="profile-section-tabs" id="profileSideTabs">
            <button type="button" class="side-tab active" onclick="scrollProfileSection('contactSection')">ข้อมูลติดต่อ</button>
            <button type="button" class="side-tab" onclick="scrollProfileSection('educationSection')">ข้อมูลการศึกษา</button>
            ${isTeacher ? `<button type="button" class="side-tab" onclick="scrollProfileSection('experienceSection')">ประสบการณ์</button>` : ''}
          </aside>

          <div class="profile-scroll" id="profileScrollBody">
          <section class="profile-section" id="contactSection">
            <details class="profile-section-toggle" open>
              <summary>ข้อมูลติดต่อและหน่วยงาน</summary>
              <div class="info-grid">
                ${renderInfo('อีเมล', person.EMAIL)}
                ${renderInfo('หน่วยงานภายใน', getPersonDepartmentText(person))}
                ${renderInfo('ตำแหน่ง', getPublicPositionText(person))}
              </div>
            </details>
          </section>

        ${educationBlocks ? `
          <section class="profile-section" id="educationSection">
            <details class="profile-section-toggle" open>
              <summary>ข้อมูลการศึกษา</summary>
              <p class="section-kicker">ประวัติการศึกษา</p>
              <div class="education-list">${educationBlocks}</div>
            </details>
          </section>
        ` : ''}

        ${isTeacher ? `
          <section class="profile-section" id="experienceSection">
            <details class="profile-section-toggle" open>
              <summary>ประสบการณ์และความเชี่ยวชาญ</summary>
              <div class="experience-list" id="practiceExtraSlot">
                ${renderExperience('ประสบการณ์พยาบาล', firstValue(person.EXPERIENCE_NURSE, person.EXPERENCE_NURSE))}
                ${renderExperience('ประสบการณ์สอน', firstValue(person.EXPERIENCE_TEACH, person.EXPERENCE_TEACH))}
                ${renderExperience('ความเชี่ยวชาญ', firstValue(person.PROFICIENCY, person.EXPERTISE))}
                <span class="section-kicker" id="practiceLoadingHint">กำลังโหลดข้อมูลเพิ่มเติม...</span>
              </div>
            </details>
          </section>
        ` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

// เติมส่วนงานวิจัย/ความเชี่ยวชาญเพิ่มเติมเข้าไปในหน้าโปรไฟล์ที่ขึ้นอยู่แล้ว หลังโหลดสำเร็จ
function fillPublicProfileExtras(researchRows, practiceRows) {
  const practiceBlocks = (practiceRows || []).map(renderFacultyPractice).join('');
  const practiceHint = document.getElementById('practiceLoadingHint');
  if (practiceHint) practiceHint.remove();
  const practiceSlot = document.getElementById('practiceExtraSlot');
  if (practiceSlot && practiceBlocks) practiceSlot.insertAdjacentHTML('beforeend', practiceBlocks);

  const researchBlocks = (researchRows || []).map(renderResearch).join('');
  if (!researchBlocks) return;

  const tabs = document.getElementById('profileSideTabs');
  if (tabs) tabs.insertAdjacentHTML('beforeend', `<button type="button" class="side-tab" onclick="scrollProfileSection('researchSection')">งานวิจัย</button>`);

  const scrollBody = document.getElementById('profileScrollBody');
  if (scrollBody) {
    scrollBody.insertAdjacentHTML('beforeend', `
      <section class="profile-section" id="researchSection">
        <details class="profile-section-toggle">
          <summary>
            <span>ผลงานวิจัย / วิชาการ</span>
            <b>${researchRows.length} รายการ</b>
          </summary>
          <div class="research-list">${researchBlocks}</div>
        </details>
      </section>
    `);
  }
}

function showPublicLoadingOverlay(message) {
  const overlay = document.getElementById('publicLoadingOverlay');
  if (!overlay) return;
  const text = overlay.querySelector('.loading-overlay-box span:last-child');
  if (text) text.textContent = message || 'กำลังโหลด...';
  overlay.classList.remove('hidden');
}

function hidePublicLoadingOverlay() {
  document.getElementById('publicLoadingOverlay')?.classList.add('hidden');
}

function getResearchByPerson(personId) {
  return publicResearch
    .filter(item => String(item.PERSON_ID || '').trim() === String(personId || '').trim())
    .sort((a, b) => {
      const yearA = parseInt(a['YEAR ค.ศ'] || a.YEAR || a['ปี พ.ศ.'], 10) || 0;
      const yearB = parseInt(b['YEAR ค.ศ'] || b.YEAR || b['ปี พ.ศ.'], 10) || 0;
      return yearB - yearA;
    });
}

function getFacultyPracticeByPerson(personId) {
  return publicFacultyPractice
    .filter(item => String(item.PERSON_ID || '').trim() === String(personId || '').trim())
    .sort((a, b) => (parseInt(b.FISCAL_YEAR_BE, 10) || 0) - (parseInt(a.FISCAL_YEAR_BE, 10) || 0));
}

function renderFacultyPractice(item) {
  const title = firstValue(item.EXPERTISE, item.CARE_TYPE, item.CARE_SUBTYPES);
  const detail = [
    item.CARE_SUBTYPES,
    item.ACADEMIC_GROUP,
    item.OPERATION_STATUS,
    item.FISCAL_YEAR_BE ? `ปีงบประมาณ ${item.FISCAL_YEAR_BE}` : '',
    item.SUMMARY_RESULT
  ].filter(Boolean).join(' | ');

  return renderExperience(title || 'ความเชี่ยวชาญ/บริการวิชาการ', detail || title);
}

function renderResearch(item) {
  const link = String(item.LINK || '').trim();
  const title = firstResearchValue(item, ['TITLE', 'ชื่อเรื่อง']) || '-';
  const year = firstResearchValue(item, ['YEAR ค.ศ', 'YEAR', 'ปี พ.ศ.']);
  const meta = [
    firstResearchValue(item, ['JOURNAL']),
    year,
    firstResearchValue(item, ['ตีพิมพ์', 'สถานะ']),
    firstResearchValue(item, ['TYPE']),
    firstResearchValue(item, ['INDEX_STATUS']),
    firstResearchValue(item, ['Level'])
  ].filter(Boolean).join(' | ');
  const fund = [
    firstResearchValue(item, ['ทุน']),
    firstResearchValue(item, ['แหล่งทุน']),
    formatResearchMoney(firstResearchValue(item, ['จำนวนเงิน']))
  ].filter(Boolean).join(' | ');
  const note = [
    firstResearchValue(item, ['สาขาวิชา']),
    firstResearchValue(item, ['ref'])
  ].filter(Boolean).join(' | ');

  return `
    <article class="research-entry">
      <div class="research-icon">R</div>
      <div class="research-card">
        <div>
          <span class="research-pill">${escapeHtml(year || 'ผลงานวิจัย')}</span>
          <div class="research-heading">${escapeHtml(title)}</div>
        </div>
        ${meta ? `<div class="research-meta">${escapeHtml(meta)}</div>` : ''}
        ${fund ? `<div class="research-fund">${escapeHtml(fund)}</div>` : ''}
        ${note ? `<div class="research-meta">${escapeHtml(note)}</div>` : ''}
        ${link ? `<a class="research-link" href="${escapeAttr(link)}" target="_blank" rel="noopener">เปิดผลงาน</a>` : ''}
      </div>
    </article>
  `;
}

function firstResearchValue(item, keys) {
  for (const key of keys) {
    const value = item && item[key];
    if (value !== undefined && value !== null && String(value).trim() !== '') return value;
  }
  return '';
}

function formatResearchMoney(value) {
  if (value === undefined || value === null || String(value).trim() === '') return '';
  const number = Number(String(value).replace(/,/g, ''));
  if (!isNaN(number)) return `${number.toLocaleString('th-TH')} บาท`;
  return value;
}

function closePublicProfile() {
  document.getElementById('publicProfile').classList.add('hidden');
  document.getElementById('directoryPanel').classList.remove('hidden');
  document.querySelector('.public-main').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function scrollProfileSection(sectionId) {
  const section = document.getElementById(sectionId);
  if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderEducation(label, degree, major, institute, year) {
  if (!degree && !major && !institute && !year) return '';
  return `
    <article class="education-entry">
      <div class="education-icon">🎓</div>
      <div class="education-card">
        <div class="degree-pill">${escapeHtml(label)}${degree ? ` : ${escapeHtml(degree)}` : ''}</div>
        ${major ? `<div class="education-line">สาขา ${escapeHtml(major)}</div>` : ''}
        ${institute ? `<div class="education-line">${escapeHtml(institute)}</div>` : ''}
        ${year ? `<div class="education-year">สำเร็จการศึกษา ${escapeHtml(year)}</div>` : ''}
      </div>
    </article>
  `;
}

function renderExperience(label, value) {
  if (!value) return '';
  return `
    <article class="experience-entry">
      <div class="experience-icon">★</div>
      <div class="experience-card">
        <div class="experience-pill">${escapeHtml(label)}</div>
        <div class="experience-text">${escapeHtml(value)}</div>
      </div>
    </article>
  `;
}

function firstValue() {
  for (let i = 0; i < arguments.length; i += 1) {
    const value = arguments[i];
    if (value == null) continue;
    const text = String(value).trim();
    if (text && text !== '-') return text;
  }
  return '';
}

function renderInfo(label, value) {
  if (!value) return '';
  return `
    <div class="info-item">
      <span class="info-label">${escapeHtml(label)}</span>
      <div class="info-value">${escapeHtml(value)}</div>
    </div>
  `;
}

function isPublicPerson(person) {
  if (!isPersonnelRecord(person)) return false;
  if (String(person.ACTIVE_SYS).trim().toLowerCase() !== 'true') return false;
  if (normalizeText(person.WORK_STATUS || 'ปฏิบัติงาน') !== 'ปฏิบัติงาน') return false;
  return true;
}

function isPersonnelRecord(person) {
  const type = normalizeText(person && person.PERSON_STATUS_SYS).toLowerCase();
  const role = normalizeText(person && person.ROLE).toLowerCase();
  const userType = normalizeText(person && person.USER_TYPE).toLowerCase();
  const position = normalizeText(person && person.POSITION).toLowerCase();
  const name = normalizeText(person && person.FULL_NAME).toLowerCase();
  const blocked = ['bot', 'admin', 'admin ระบบ', 'ผู้ดูแลระบบ', 'แอดมินระบบ'];

  return !blocked.some(keyword =>
    type === keyword ||
    role === keyword ||
    userType === keyword ||
    position === keyword ||
    name === keyword
  );
}

function normalizeText(value) {
  return String(value || '')
    .replace(/\s+/g, ' ')
    .trim();
}

function normalizeDepartment(value) {
  return normalizeText(value)
    .replace(/ฯ/g, '')
    .replace(/^กลุ่มวิชา/g, '')
    .replace(/^สาขาวิชา/g, '')
    .replace(/^สาขา/g, '')
    .replace(/\s+/g, '');
}

function toDepartmentFilterLabel(value) {
  const text = normalizeText(value);
  if (!text) return '';
  if (text.indexOf('สาขาวิชา') === 0) return text.replace(/^สาขาวิชา/, 'กลุ่มวิชา');
  if (text.indexOf('สาขา') === 0) return text.replace(/^สาขา/, 'กลุ่มวิชา');
  return text;
}

function displayDepartment(value) {
  return toDepartmentFilterLabel(value);
}

function getSelectedDepartmentLabel() {
  const name = publicDepartmentMap.get(activePublicDepartment) || DEPARTMENT_CODE_NAME[activePublicDepartment];
  return displayDepartment(name || activePublicDepartment || '');
}

// รหัสกลุ่มวิชา ตรงกับ getFallbackHrmDepartmentName_ ฝั่ง backend อ่านจาก DEPARTMENT_ID (department_code) ก่อนเลย
// เร็วและชัวร์กว่ารอ DEPARTMENT_NAME ที่มาจากการ join ฝั่ง backend ซึ่งบางทีว่าง/ยังไม่ resolve ทัน
const DEPARTMENT_CODE_NAME = {
  DEP001: 'กลุ่มวิชาการพยาบาลมารดาทารกและการผดุงครรภ์',
  DEP002: 'กลุ่มวิชาการพยาบาลผู้ใหญ่และผู้สูงอายุ',
  DEP003: 'กลุ่มวิชาการพยาบาลสุขภาพจิตและจิตเวช',
  DEP004: 'กลุ่มวิชาการพยาบาลเด็กและวัยรุ่น',
  DEP005: 'กลุ่มวิชาการพยาบาลอนามัยชุมชน',
  DEP006: 'สำนักงานเลขานุการคณะฯ'
};

function getDepartmentCodeName(person) {
  const code = normalizeText(person && person.DEPARTMENT_ID).toUpperCase();
  return DEPARTMENT_CODE_NAME[code] || '';
}

function getPersonDepartmentText(person) {
  const departmentId = normalizeText(person && person.DEPARTMENT_ID);
  const codeName = getDepartmentCodeName(person);
  if (codeName) return displayDepartment(codeName);

  // publicDepartmentMap ใช้เป็น fallback สำรอง (เผื่อมีรหัสกลุ่มวิชาใหม่ที่ยังไม่อยู่ใน map ด้านบน)
  if (departmentId && publicDepartmentMap.has(departmentId)) {
    return displayDepartment(publicDepartmentMap.get(departmentId));
  }

  return displayDepartment(firstValue(
    person && person.DEPARTMENT_NAME,
    person && person.DEPARTMENT,
    departmentId,
    person && person.ACADEMIC_GROUP,
    person && person.SUBJECT_GROUP,
    person && person.WORK_GROUP
  ));
}

function getPersonDisplayName(person) {
  const prefix = getPersonDisplayPrefix(person);
  const firstName = normalizeText(person && person.FIRST_NAME);
  const lastName = normalizeText(person && person.LAST_NAME);
  const composedName = [prefix, firstName, lastName].filter(Boolean).join(' ').trim();
  if (firstName || lastName) return composedName;
  // FULL_NAME อาจมีคำนำหน้าเดิมติดมาแล้ว จึงเอาออกก่อนประกอบใหม่
  const name = normalizeText(person && person.FULL_NAME).replace(/^(?:(?:ผู้ช่วยศาสตราจารย์|รองศาสตราจารย์|ศาสตราจารย์|อาจารย์|ผศ\.|รศ\.|ศ\.|ดร\.|นางสาว|นาง|นาย)\s*)+/, '');
  return name ? [prefix, name].filter(Boolean).join(' ') : '-';
}

function getPersonDisplayPrefix(person) {
  if (!person) return '';
  const titles = [person.ACADEMIC_POSITION, person.academic_position,
    person.TITLE_EMPLOYEE, person.TITLE_AMPLOYEE, person.title_employee,
    person.PREFIX, person.TITLE_NAME].map(normalizeText).join(' ');
  // ตรวจตำแหน่งสูงก่อน และเลือกเพียงตำแหน่งเดียว ไม่ต่อ "อาจารย์" ซ้ำ
  const rank = /ผู้ช่วยศาสตราจารย์|ผศ\./.test(titles) ? 'ผู้ช่วยศาสตราจารย์'
    : /รองศาสตราจารย์|รศ\./.test(titles) ? 'รองศาสตราจารย์'
    : /ศาสตราจารย์|(?:^|\s)ศ\./.test(titles) ? 'ศาสตราจารย์' : '';
  const doctoralFields = [person.DOCTORAL_DEGREE, person.DOCTORAL_DEGREES_YEAR];
  const doctoralFlag = person.HAS_DOCTORAL_DEGREE;
  const educationRows = Array.isArray(person.EDUCATION_ROWS) ? person.EDUCATION_ROWS : [];
  const hasDoctorate = doctoralFlag === true || String(doctoralFlag).toLowerCase() === 'true'
    || educationRows.some(row => /^(DOCTORAL|ปริญญาเอก)$/i.test(normalizeText(row.DEGREE_LEVEL || row.degree_level)))
    || doctoralFields.some(value => Boolean(firstValue(value)))
    || /ดร\./.test(titles)
    || /^(?:(?:ผู้ช่วยศาสตราจารย์|รองศาสตราจารย์|ศาสตราจารย์|อาจารย์|ผศ\.|รศ\.|ศ\.)\s*)*ดร\./.test(normalizeText(person.FULL_NAME));
  if (rank) return [rank, hasDoctorate ? 'ดร.' : ''].filter(Boolean).join(' ');
  if (hasDoctorate) return 'ดร.';
  return /อาจารย์/.test(titles) || getPersonnelGroup(person) === 'LECTURER' ? 'อาจารย์' : '';
}

function getPublicPositionText(person) {
  // คณบดีให้ขึ้นตำแหน่งคงที่เสมอ กันปัญหา POSITION/POSITION_NAME จาก backend มาเป็นรหัส (เช่น POS001)
  // หรือว่างเปล่าเวลา lookup master_position ไม่เจอ
  if (isDeanPerson(person)) return 'คณบดีคณะพยาบาลศาสตร์';
  const position = normalizeText(person && person.POSITION);
  if (position && !/^POS\d+/i.test(position)) return position;
  const name = normalizeText(person && person.POSITION_NAME);
  if (name && !/^POS\d+/i.test(name)) return name;

  // อาจารย์/เจ้าหน้าที่ทั่วไปที่ไม่มีตำแหน่งเฉพาะระบุไว้ (ไม่มี position record) ให้ขึ้นตำแหน่งพื้นฐานตามกลุ่มแทน "-"
  // ระหว่างรอข้อมูลตำแหน่งเจาะจงจริงจากพื้นหลัง (ถ้ามี)
  const group = getPersonnelGroup(person);
  if (group === 'LECTURER') return 'อาจารย์';
  if (group === 'STAFF') return 'เจ้าหน้าที่';
  return '';
}

function cssEscapeValue(value) {
  if (window.CSS && typeof window.CSS.escape === 'function') {
    return window.CSS.escape(String(value || ''));
  }
  return String(value || '').replace(/["\\]/g, '\\$&');
}

function updatePublicCardFromPerson(person) {
  const id = String(person && person.PERSON_ID || '').trim();
  if (!id) return;
  const card = document.querySelector(`.person-card[data-person-id="${cssEscapeValue(id)}"]`);
  if (!card) return;
  const nameEl = card.querySelector('.person-name');
  const roleEl = card.querySelector('.person-role');
  const departmentEl = card.querySelector('.person-department');
  if (nameEl) nameEl.textContent = getPersonDisplayName(person);
  setLoadingAwareText(roleEl, getPublicPositionText(person));
  setLoadingAwareText(departmentEl, getPersonDepartmentText(person));
}

function renderLoadingAwareParagraph(value) {
  const text = normalizeText(value);
  return `<p class="${text ? '' : 'is-loading-text'}">${escapeHtml(text || PUBLIC_LOADING_TEXT)}</p>`;
}

function setLoadingAwareText(el, value) {
  if (!el) return;
  const text = normalizeText(value);
  el.textContent = text || PUBLIC_LOADING_TEXT;
  el.classList.toggle('is-loading-text', !text);
}

function needsPublicProfileHydration(person) {
  if (!person || !person.PERSON_ID) return false;
  // รายชื่อแบบย่อไม่มีวุฒิ ต้องอ่านโปรไฟล์ก่อนจึงจะตัดสินว่าเติม ดร. หรือไม่
  if (person.HAS_DOCTORAL_DEGREE == null && !Array.isArray(person.EDUCATION_ROWS)) return true;
  if (!getPublicPositionText(person)) return true;
  if (!getPersonDepartmentText(person)) return true;
  if (!normalizeText(person.TITLE_EMPLOYEE || person.TITLE_AMPLOYEE || person.TITLE_NAME || person.PREFIX)) return true;
  return false;
}

function hydrateVisiblePublicCards() {
  const targets = visiblePublicPeople
    .filter(needsPublicProfileHydration)
    .map(person => String(person.PERSON_ID || '').trim())
    .filter(Boolean)
    .filter(id => !pendingPublicProfileLoads.has(id) && !attemptedHydrationIds.has(id));

  if (!targets.length) return;

  hydratePublicCardBatch(targets.slice(0, 24)).then(() => {
    // โหลดกลุ่มถัดไปด้วย เพื่อไม่ให้คนลำดับที่ 25 เป็นต้นไปค้างชื่อเดิม
    hydrateVisiblePublicCards();
  });
}

async function hydratePublicCardBatch(ids) {
  const batchSize = 4;
  const delayMs = 220;

  for (let start = 0; start < ids.length; start += batchSize) {
    const batch = ids.slice(start, start + batchSize);
    batch.forEach(id => {
      pendingPublicProfileLoads.add(id);
      attemptedHydrationIds.add(id);
    });

    await Promise.all(batch.map(id =>
      loadPublicProfile(id)
        .then(person => {
          if (person) updatePublicCardFromPerson(person);
        })
        .catch(() => null)
        .finally(() => pendingPublicProfileLoads.delete(id))
    ));

    if (start + batchSize < ids.length) {
      await new Promise(resolve => setTimeout(resolve, delayMs));
    }
  }
}


function isDeanPosition(position) {
  return position === 'คณบดีคณะพยาบาลศาสตร์' || position === 'คณบดี';
}

function isHeadOfficePosition(position) {
  return position.indexOf('หัวหน้าสำนัก') === 0;
}

function getPersonnelGroup(person) {
  const type = normalizeText(person && person.PERSON_STATUS_SYS);
  const workGroup = normalizeText(person && person.WORK_GROUP);
  const position = normalizeText(person && person.POSITION);
  const title = normalizeText(firstValue(
    person && person.TITLE_EMPLOYEE,
    person && person.TITLE_AMPLOYEE,
    person && person.PREFIX,
    person && person.TITLE_NAME
  ));

  if (workGroup.indexOf('วิชาการ') >= 0) return 'LECTURER';
  if (workGroup.indexOf('สนับสนุน') >= 0) return 'STAFF';

  if (
    type === 'เจ้าหน้าที่' ||
    position === 'เจ้าหน้าที่' ||
    isHeadOfficePosition(position)
  ) {
    return 'STAFF';
  }

  if (
    type === 'อาจารย์' ||
    type.indexOf('ศาสตราจารย์') >= 0 ||
    position === 'อาจารย์' ||
    position.indexOf('ศาสตราจารย์') >= 0 ||
    title.indexOf('อาจารย์') >= 0 ||
    title.indexOf('ศาสตราจารย์') >= 0 ||
    isDeanPosition(position) ||
    position.indexOf('รองคณบดี') === 0 ||
    position === 'ผู้ช่วยคณบดี'
  ) {
    return 'LECTURER';
  }

  return type || position || 'STAFF';
}

// รหัสตำแหน่งผู้บริหาร (คณบดี/รองคณบดี/ผู้ช่วยคณบดี) ตรงกับ getFallbackHrmPositionName_ ฝั่ง backend
// อ่านจาก POSITION_ID (position_code) ก่อนเพราะเป็นค่าคงที่ ไม่ขึ้นกับ flag IS_EXECUTIVE ที่ข้อมูลอาจตกหล่น
// และไม่ต้องพึ่งจับคู่ข้อความตำแหน่งที่อาจสะกด/เว้นวรรคต่างกัน แปลงผลได้เร็วด้วย lookup ตรง ๆ
const EXECUTIVE_POSITION_CODE_ROLE = {
  POS001: 'DEAN',
  POS005: 'DEPUTY_DEAN',
  POS006: 'ASSISTANT_DEAN'
};

function getExecutivePositionCodeRole(person) {
  const code = normalizeText(person && person.POSITION_ID).toUpperCase();
  return EXECUTIVE_POSITION_CODE_ROLE[code] || '';
}

function isExecutivePerson(person) {
  if (getExecutivePositionCodeRole(person)) return true;
  return isTrueValue(person && person.IS_EXECUTIVE);
}

function isAcademicExecutivePerson(person) {
  return isExecutivePerson(person) && isPersonInPublicAcademicGroup(person);
}

function isPersonInPublicGroup(person, group) {
  if (group === 'LECTURER') return isPersonInPublicAcademicGroup(person);
  if (group === 'STAFF') return getPersonnelGroup(person) === 'STAFF';
  return getPersonnelGroup(person) === group;
}

function isPersonInPublicAcademicGroup(person) {
  if (getPersonnelGroup(person) === 'LECTURER') return true;
  if (!isExecutivePerson(person)) return false;

  const department = normalizeDepartment(getPersonDepartmentText(person));
  if (!department) return false;
  return department !== normalizeDepartment('สำนักงานเลขานุการคณะฯ');
}

function isDeanPerson(person) {
  if (getExecutivePositionCodeRole(person) === 'DEAN') return true;
  return isDeanPosition(normalizeText(person && person.POSITION)) || getExplicitOrder(person) === 1;
}

function isSupportExecutivePerson(person) {
  return isExecutivePerson(person) && getPersonnelGroup(person) === 'STAFF';
}

function getExecutiveLabel(person) {
  if (!isExecutivePerson(person)) return '';
  return isSupportExecutivePerson(person) ? 'ผู้บริหารสายสนับสนุน' : 'คณะผู้บริหาร';
}

function comparePublicPeople(a, b) {
  const execCompare = compareExecutivePeople(a, b);
  if (execCompare !== 0) return execCompare;

  const groupCompare = getGroupRank(a) - getGroupRank(b);
  if (groupCompare !== 0) return groupCompare;

  const dep = normalizeText(getPersonDepartmentText(a)).localeCompare(normalizeText(getPersonDepartmentText(b)), 'th');
  if (dep !== 0) return dep;

  return normalizeText(getPersonDisplayName(a)).localeCompare(normalizeText(getPersonDisplayName(b)), 'th');
}

function compareExecutivePeople(a, b) {
  const rank = getExecutiveRank(a) - getExecutiveRank(b);
  if (rank !== 0) return rank;
  return normalizeText(getPersonDisplayName(a)).localeCompare(normalizeText(getPersonDisplayName(b)), 'th');
}

function getGroupRank(person) {
  if (isExecutivePerson(person)) return 1;
  return getPersonnelGroup(person) === 'LECTURER' ? 2 : 3;
}

function getExecutiveRank(person) {
  const position = normalizeText(person && person.POSITION);
  if (isDeanPosition(position)) return 1;
  if (position.indexOf('รองคณบดีฝ่ายบริหาร') === 0) return 2;
  if (position.indexOf('รองคณบดีฝ่ายวิชาการ') === 0) return 3;
  if (position.indexOf('รองคณบดีฝ่ายกิจการ') === 0) return 4;
  if (position.indexOf('รองคณบดี') === 0) return 4;
  if (position === 'ผู้ช่วยคณบดี') return 5;
  if (isHeadOfficePosition(position)) return 6;

  const explicitOrder = getExplicitOrder(person);
  if (explicitOrder < 999) return explicitOrder;
  return isExecutivePerson(person) ? 50 : 999;
}

function getExplicitOrder(person) {
  const raw = person && (
    person.EXECUTIVE_ORDER ||
    person.DISPLAY_ORDER ||
    person.ORDER ||
    person.SORT_ORDER
  );
  const order = parseInt(raw, 10);
  return isNaN(order) ? 999 : order;
}

function isTrueValue(value) {
  if (value === true) return true;
  const text = normalizeText(value).toUpperCase();
  return ['TRUE', 'YES', 'Y', '1', 'ใช่'].indexOf(text) !== -1;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll('`', '');
}
